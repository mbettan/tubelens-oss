[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tubelens-oss"
version = "1.0.0"
description = "YouTube research MCP server for AI-powered video analysis, metadata extraction, and rights-gated transcription."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12, <3.15"
dependencies = [
    "mcp>=1.9.0,<2.0.0",
    "starlette>=0.38.0",
    "uvicorn[standard]>=0.30.0",
    "google-genai>=1.0.0",
    "google-api-python-client>=2.130.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

authors = [
    { name = "Michael Bettan" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "youtube",
    "gemini",
    "ai",
    "video-analysis",
    "transcription",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/mbettan/tubelens-oss"
Repository = "https://github.com/mbettan/tubelens-oss"
Issues = "https://github.com/mbettan/tubelens-oss/issues"

[project.scripts]
tubelens = "src.server:run_server"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
